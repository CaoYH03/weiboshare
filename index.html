<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>微博批量分享助手</title>
  <style>
    :root {
      --bg: #f5f1ea;
      --panel: rgba(255, 255, 255, 0.92);
      --accent: #e24d2f;
      --accent-dark: #bc361d;
      --text: #1f1f1f;
      --muted: #6e625d;
      --border: #dccfc3;
      --shadow: 0 20px 50px rgba(97, 62, 31, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      padding: 24px;
      max-width: 960px;
      margin: 0 auto;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(255, 173, 122, 0.32), transparent 28%),
        linear-gradient(180deg, #fbf5ef 0%, #f4efe8 100%);
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      padding: 28px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    h2 {
      margin: 0;
      font-size: 28px;
    }

    .subheading {
      color: var(--muted);
      margin-top: -10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field input,
    textarea {
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255, 251, 247, 0.92);
      color: var(--text);
    }

    textarea {
      width: 100%;
      height: 240px;
      resize: vertical;
    }

    .range-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    button {
      padding: 10px 18px;
      background: linear-gradient(135deg, var(--accent), #ff8f4b);
      color: white;
      border: none;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: linear-gradient(135deg, var(--accent-dark), #f9722d);
    }

    button:disabled {
      background: #cccccc;
      cursor: not-allowed;
    }

    .summary,
    #uploadInfo {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      min-height: 120px;
      max-height: 220px;
      overflow-y: auto;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: rgba(255, 251, 247, 0.88);
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }

      .container {
        padding: 18px;
        border-radius: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>微博批量分享助手</h2>
    <div class="subheading">先导入链接，再启动浏览器登录微博，最后执行批量分享。</div>

    <div class="grid">
      <div class="field">
        <label>上传链接文件</label>
        <input type="file" id="fileInput" accept=".txt">
        <div id="uploadInfo"></div>
      </div>
      <div class="field">
        <label>Chrome 可执行文件路径</label>
        <input type="text" id="chromePathInput" placeholder="留空时自动探测本机 Chrome">
      </div>
    </div>

    <div class="grid">
      <div class="field">
        <label>分享间隔（秒）</label>
        <input type="number" id="intervalInput" value="30" min="10">
      </div>
      <div class="field">
        <label>选择区间（默认全部）</label>
        <div class="range-group">
          <input type="number" id="minIndex" placeholder="起始">
          <span>到</span>
          <input type="number" id="maxIndex" placeholder="结束">
          <button id="selectButton">筛选</button>
        </div>
      </div>
    </div>

    <div class="field">
      <label>待分享链接预览</label>
      <div id="selectedSummary" class="summary">当前还没有可分享的链接</div>
      <textarea id="linksInput" readonly placeholder="上传 txt 文件或点击“同步链接”后会在这里显示内容"></textarea>
    </div>

    <div class="control-panel">
      <button id="startButton" disabled>启动浏览器</button>
      <button id="confirmLogin" disabled>开始分享</button>
      <button id="stopButton" disabled>停止分享</button>
      <button id="syncButton">同步链接</button>
    </div>

    <div id="status" class="status"></div>
  </div>
  <script type="module" src="renderer.js"></script>
</body>
</html>
